name: Companion signed release
# Signs the extension with Mozilla (unlisted, self-distributed) and publishes
# it as a GitHub release plus an update feed. Start a release by setting
# release-request.json to the package.json version and pushing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release-request.json]
permissions:
  contents: write
concurrency:
  group: companion-signed-release
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firefox-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: Check release request
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          requested=$(node -p "require('./release-request.json').version")
          if [ "$version" != "$requested" ]; then
            echo "::error::release-request.json ($requested) must match package.json ($version)"; exit 1
          fi
          if gh release view "companion-v$version" >/dev/null 2>&1; then
            echo "::error::companion-v$version is already released; bump the version."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check AMO credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET are not available to this branch in the firefox-signing environment."; exit 1
          fi
      - name: Mozilla signing (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p dist/signed
          npx --yes web-ext@8.3.0 sign \
            --source-dir dist/firefox/extension \
            --artifacts-dir dist/signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 900000 --no-input
          ls -la dist/signed
          [ "$(find dist/signed -name '*.xpi' | wc -l)" -eq 1 ]
      - name: Publish release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.req.outputs.version }}
        run: |
          xpi="dist/roll20-sheet-companion-$VERSION.xpi"
          cp "$(find dist/signed -name '*.xpi' | head -n 1)" "$xpi"
          node scripts/update-feed.mjs "$xpi" "$VERSION"
          gh release create "companion-v$VERSION" "$xpi" --target "$GITHUB_SHA" --prerelease \
            --title "Roll20 Sheet Companion v$VERSION (Mozilla signed)" \
            --notes "Mozilla-signed Firefox build. Open the .xpi in Firefox to install; later versions update automatically."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "release: signed v$VERSION update feed"
          git push origin HEAD:${GITHUB_REF_NAME}
