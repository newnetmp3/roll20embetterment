name: Foundryembetterment release
# Publishes the Foundry VTT module when foundry/module.json gets a new version
# on main: a GitHub release "foundryembetterment-v<version>" holding the zip
# and module.json. Foundry finds it through the manifest URL in module.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [foundry/module.json]
permissions:
  contents: write
concurrency:
  group: foundryembetterment-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/build-foundry.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./foundry/module.json').version")"
          TAG="foundryembetterment-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" dist/foundry/foundryembetterment.zip dist/foundry/module.json \
            --target "$GITHUB_SHA" --latest=false \
            --title "Foundryembetterment v$VERSION (Foundry VTT module)" \
            --notes "Foundry VTT module for the dnd5e system. Install in Foundry: Add-on Modules → Install Module → paste https://raw.githubusercontent.com/newnetmp3/roll20embetterment/main/foundry/module.json"
