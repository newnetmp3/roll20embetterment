name: R20eb Firefox CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:firefox
      - run: git diff --exit-code -- roll20-embetterment.user.js
      - uses: actions/upload-artifact@v4
        with:
          name: r20eb-firefox-unsigned
          path: dist/firefox/roll20-embetterment-firefox-*.zip
          if-no-files-found: error
          retention-days: 30
