name: R20eb CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: git diff --exit-code -- roll20-embetterment.user.js
      - uses: actions/upload-artifact@v4
        with:
          name: roll20-embetterment-firefox-chrome
          path: dist/roll20-embetterment-*.zip
          if-no-files-found: error
          retention-days: 30
