name: Companion CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npx --yes web-ext@8.3.0 lint --source-dir dist/firefox/extension --warnings-as-errors=false
      - uses: actions/upload-artifact@v4
        with:
          name: roll20-sheet-companion-unsigned
          path: dist/firefox/*.zip
